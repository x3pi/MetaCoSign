syntax = "proto3";
package rpc_request;

option go_package = "github.com/meta-node-blockchain/meta-node/pkg/proto";

// RpcLogEntry - Log entry dùng chung cho cả Event và Receipt
// Tất cả fields dùng string để khớp với chain JSON output (hex format)
message RpcLogEntry {
    string address = 1;               // Contract address
    repeated string topics = 2;       // Topics (event signature + indexed params)
    string data = 3;                  // Non-indexed event data (hex)
    string block_number = 4;          // Block number (hex)
    string transaction_hash = 5;      // Transaction hash
    string block_hash = 6;            // Block hash
    string transaction_index = 7;     // Transaction index (hex)
    string log_index = 8;             // Log index (hex)
    bool removed = 9;                 // Removed flag (reorg)
}

// RpcEvent - Subscription event notification = subscription_id + log entry
message RpcEvent {
    string subscription_id = 1;       // Subscription ID (0xabc...)
    RpcLogEntry log = 2;              // Log entry data
}

// RpcReceipt - Transaction receipt gửi qua TCP (pure protobuf)
message RpcReceipt {
    string transaction_hash = 1;
    string from = 2;
    string to = 3;
    string contract_address = 4;      // Nếu deploy contract
    string status = 5;                // "0x1" = success, "0x0" = fail
    string gas_used = 6;              // Hex string
    string cumulative_gas_used = 7;
    string effective_gas_price = 8;
    string block_hash = 9;
    string block_number = 10;         // Hex string
    string transaction_index = 11;
    string type = 12;                 // Transaction type
    repeated RpcLogEntry logs = 13;   // Dùng chung RpcLogEntry
    string logs_bloom = 14;
}
